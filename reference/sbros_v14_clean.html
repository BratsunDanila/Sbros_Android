function memoryDetail(){const m=state.thoughts.find(x=>x.id===thoughtDetail);if(!m){thoughtDetail='';return thoughtsView()}return `<div class="screen thoughts-screen thought-detail"><div class="thoughts-top"><button class="thoughts-back" data-action="back-to-thoughts">${ic('left','sm')} Мысли</button><button class="thoughts-search-btn ${m.starred?'active':''}" data-action="star-thought" data-id="${m.id}" aria-label="${m.starred?'Убрать из избранного':'В избранное'}">${ic('heart')}</button></div><div class="detail-mark">${ic(m.kind==='idea'?'bulb':'feather','sm')} ${m.kind==='idea'?'ИДЕЯ':'ЗАПИСЬ ИЗ ДНЕВНИКА'}</div><h1 class="detail-title">${esc(m.title)}</h1><div class="detail-date">${dateTime(m.created)} · ${new Date(m.created).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}</div><div class="detail-paper"><span class="detail-quotation">“</span><p>${esc(m.body).replace(/\n/g,'<br>')}</p></div><div class="detail-actions"><button class="detail-action" data-action="extend-thought" data-id="${m.id}">${ic('spark','sm')} Продолжить мысль</button><button class="detail-action" data-action="related-thoughts" data-id="${m.id}">${ic('layers','sm')} Похожие</button><button class="detail-action" data-action="turn-thought-task" data-id="${m.id}">${ic('bolt','sm')} В действие</button></div><div class="detail-footer"><button class="detail-link" data-action="edit-thought" data-id="${m.id}">${ic('edit','sm')} Изменить</button><button class="detail-link danger" data-action="delete-thought" data-id="${m.id}">${ic('trash','sm')} Удалить</button></div></div>`}

function thoughtRelated(id){const m=state.thoughts.find(x=>x.id===id);if(!m)return;modal='thought-related';modalId=id;const stop=new Set(['что','это','потом','когда','было','мне','для','как','можно','свои','свои','хочется','тоже','если','здесь','есть','чтобы','такие','него','всё','просто','себе','от','или','она','они']);const terms=s=>new Set((s.toLowerCase().match(/[а-яёa-z]{4,}/g)||[]).filter(w=>!stop.has(w)).map(w=>w.slice(0,5)));const src=terms(m.title+' '+m.body);const matches=state.thoughts.filter(x=>x.id!==id).map(x=>({x,score:[...terms(x.title+' '+x.body)].filter(t=>src.has(t)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4);sheet(`<div class="tiny-ai-label">${ic('spark','sm')} ПОИСК СВЯЗЕЙ · ДЕМО</div><h2 class="sheet-title">Похожие мысли</h2><p class="sheet-sub">Ищем общие слова и темы в твоих записях. Семантический поиск будет в реальном приложении.</p>${matches.length?matches.map(a=>`<button class="related-card" data-action="jump-to-thought" data-id="${a.x.id}"><span class="related-icon">${ic(a.x.kind==='idea'?'bulb':'feather','sm')}</span><span><strong>${esc(a.x.title)}</strong><small>${dateTime(a.x.created)}</small></span>${ic('chevron','sm')}</button>`).join(''):'<div class="empty-text">Похожих записей пока не нашлось. Они могут появиться позже.</div>'}<button class="secondary-btn" style="width:100%;margin-top:10px" data-action="close">Закрыть</button>`)}
function thoughtToTask(id){const m=state.thoughts.find(x=>x.id===id);if(!m)return;modal='thought-task';modalId=id;sheet(`<h2 class="sheet-title">Из мысли — в действие</h2><p class="sheet-sub">Только если действительно хочешь что-то сделать.</p><label class="field-label">КОНКРЕТНОЕ ДЕЙСТВИЕ ИЛИ РЕЗУЛЬТАТ</label><input class="field" id="thought-task-name" value="${esc(m.title)}"><label class="field-label">КУДА ДОБАВИТЬ</label><select class="field" id="thought-task-type"><option value="next">Следующие действия</option><option value="projects">Новый проект</option><option value="someday">Когда-нибудь</option></select><button class="primary-btn" data-action="save-thought-task">Добавить ${ic('check','sm')}</button><p class="caption" style="margin-top:11px">Исходная мысль останется в дневнике.</p>`)}

<button class="capture-history-link" data-action="capture-history">${ic('clock','sm')} История сбросов <span>${state.captures.length}</span>${ic('chevron','sm')}</button></div>`}

function captureView(){if(capturePhase==='processing')return `<div class="screen capture-screen capture-progress"><div class="capture-topline"><span class="micro-kicker">СБРОС / РАЗБОР</span><button class="circle-btn" data-action="settings">${ic('sliders')}</button></div><div class="thinking-center"><div class="thinking-mark"><span></span><span></span><span></span></div><h1>Разбираю<br>по смыслу.</h1><p>Отделяю действия от идей и записей.</p></div><div class="capture-note">Локальная демонстрация. Настоящий ИИ пока не подключён.</div></div>`;

const listening=capturePhase==='listening';return `<div class="screen capture-screen capture-idle"><div class="capture-topline"><button class="circle-btn" data-action="settings" aria-label="Настройки">${ic('sliders')}</button></div><div class="capture-intro"><div class="capture-eyebrow">ЗДЕСЬ МОЖНО ВСЁ</div><h1>Что у тебя<br><em>на уме?</em></h1><p>Дела, идеи, переживания — говори как есть.<br>Разберёмся потом.</p></div><div class="capture-visual ${listening?'is-listening':''}"><div class="mic-orbit orbit-outer"></div><div class="mic-orbit orbit-middle"></div><div class="mic-orbit orbit-inner"></div><div class="mic-stars st1">✧</div><div class="mic-stars st2">✳</div><button class="hero-mic" data-action="voice-toggle" aria-label="${listening?'Остановить запись':'Начать голосовой ввод'}">${ic(listening?'check':'mic','lg')}</button></div><div class="capture-state-line"><strong>${listening?'Слушаю тебя…':'Нажми, чтобы говорить'}</strong><span>${listening?'Нажми ещё раз, чтобы закончить.':'Или просто напиши ниже'}</span></div><div class="capture-input-wrap"><textarea id="capture-text" aria-label="Текст сброса" placeholder="Напиши всё, что хочется выгрузить…" rows="3">${esc(captureText)}</textarea><div class="capture-input-foot"><span>${captureText.trim()?'Необязательно формулировать идеально.':'Никаких категорий и обязательных полей.'}</span><span class="capture-char">${captureText.length?captureText.length+' зн.':''}</span></div></div><div class="capture-bottom-actions"><button class="capture-later" data-action="capture-save-inbox" ${captureText.trim()?'':'disabled'}>На потом</button><button class="capture-analyze" id="capture-analyze" data-action="start-analysis" ${captureText.trim()?'':'disabled'}>Разобрать ${ic('arrowright','sm')}</button></div></div>`}
function captureReview(){return `<div class="screen capture-screen capture-review"><div class="capture-topline"><button class="capture-back" data-action="return-capture">${ic('left','sm')} К записи</button><span class="micro-kicker">ПРОВЕРКА ПЕРЕД СОХРАНЕНИЕМ</span></div><div class="review-intro"><div class="review-tiny-icon">${ic('spark','sm')}</div><h1>Вот что<br>получилось.</h1><p>Я предложил распределение. Можешь изменить всё — окончательное решение за тобой.</p></div><details class="capture-original"><summary>Исходная запись ${ic('chevron','sm')}</summary><p>${esc(captureText).replace(/\n/g,'<br>')}</p></details><div class="capture-cards-head"><span>ПРЕДЛОЖЕНИЯ</span><span>${captureDraft.length}</span></div><div class="capture-card-list">${captureDraft.map((d,i)=>`<div class="capture-review-card" data-proposal="${d.id}" style="--n:${Math.min(i,6)}"><div class="capture-review-head"><span class="proposal-round">${ic(routeIcon[d.kind]||'feather','sm')}</span><select class="capture-review-kind" aria-label="Тип записи">${routingOptions.map(([key,label])=>`<option value="${key}" ${d.kind===key?'selected':''}>${label}</option>`).join('')}</select><button class="review-del" data-action="review-remove" data-id="${d.id}" aria-label="Убрать предложение">${ic('x','sm')}</button></div><textarea class="capture-review-title" aria-label="Текст предложения" rows="${d.title.length>72?3:2}">${esc(d.title)}</textarea>${d.kind==='cal'?`<div class="proposal-date-fields"><input class="capture-proposal-date" type="date" aria-label="Дата события" value="${esc(d.date||'')}"><input class="capture-proposal-time" type="time" aria-label="Время" value="${esc(d.time||'')}"></div><small class="proposal-hint">В календаре нужна настоящая дата</small>`:''}</div>`).join('')}</div><button class="capture-add-card" data-action="review-add">${ic('plus','sm')} Добавить ещё</button><p class="review-privacy">${ic('check','sm')} Ничего не будет разложено без подтверждения.</p><button class="approve-all" data-action="approve-analysis" ${!captureDraft.length?'disabled':''}>Подтвердить и сохранить ${ic('arrowright','sm')}</button><p class="capture-demo-hint">Разбор демонстрационный: локальные правила вместо подключённой языковой модели.</p></div>`}
function captureSaved(){const r=receiptStats||{count:0,tasks:0,thoughts:0,events:0,rest:0};return `<div class="screen capture-screen capture-success"><div class="capture-topline"><span class="micro-kicker">СБРОС / ГОТОВО</span><span class="soft-tag">Всё сохранено</span></div><div class="success-center"><div class="success-sticker"><span>${ic('check','lg')}</span><i>✧</i></div><span class="micro-kicker">МОЖНО ВЫДОХНУТЬ</span><h1>Теперь всё<br>на своих местах.</h1><p>${r.count} ${r.count===1?'запись сохранена':r.count>=2&&r.count<=4?'записи сохранены':'записей сохранено'}. Исходный текст тоже остался в истории сброса.</p><div class="success-totals">${r.tasks?`<span>${ic('bolt','sm')} Дела · ${r.tasks}</span>`:''}${r.thoughts?`<span>${ic('feather','sm')} Мысли · ${r.thoughts}</span>`:''}${r.events?`<span>${ic('calendar','sm')} Календарь · ${r.events}</span>`:''}${r.rest?`<span>${ic('review','sm')} Обзор · ${r.rest}</span>`:''}</div></div><div class="success-actions"><button class="approve-all" data-action="capture-again">${ic('mic','sm')} Новый сброс</button><button class="success-secondary" data-action="go-to" data-tab="${r.tasks?'now':r.thoughts?'thoughts':r.events?'cal':'review'}">Посмотреть результат ${ic('arrowright','sm')}</button></div></div>`}
function updateCaptureButton(){const has=!!captureText.trim();const b=document.getElementById('capture-analyze'),later=document.querySelector('.capture-later');if(b)b.disabled=!has;if(later)later.disabled=!has;const char=document.querySelector('.capture-char');if(char)char.textContent=captureText.length?captureText.length+' зн.':''}
function stopVoice(){if(captureVoice){try{captureVoice.abort()}catch{}}captureVoice=null;captureVoiceActive=false;if(capturePhase==='listening')capturePhase='idle'}
function toggleVoice(){if(captureVoiceActive){if(captureVoice){try{captureVoice.stop()}catch{}}captureVoiceActive=false;capturePhase='idle';render(false);return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){say('Распознавание речи недоступно здесь. Можно написать текст.');document.getElementById('capture-text')?.focus();return}try{const r=new SR();captureVoice=r;r.lang='ru-RU';r.continuous=true;r.interimResults=true;captureBase=captureText.trim();r.onstart=()=>{captureVoiceActive=true;capturePhase='listening';render(false)};r.onresult=e=>{let final='',interim='';for(let j=0;j<e.results.length;j++){const t=e.results[j][0].transcript;if(e.results[j].isFinal)final+=' '+t;else interim+=' '+t}captureText=[captureBase,final.trim(),interim.trim()].filter(Boolean).join(' ');const tx=document.getElementById('capture-text');if(tx){tx.value=captureText;tx.scrollTop=tx.scrollHeight;updateCaptureButton()}};r.onerror=e=>{captureVoiceActive=false;capturePhase='idle';if(e.error!=='aborted'&&e.error!=='no-speech')say('Не удалось распознать речь. Текстовый ввод доступен.');render(false)};r.onend=()=>{captureVoiceActive=false;if(capturePhase==='listening'){capturePhase='idle';render(false)}};r.start()}catch{say('Не удалось включить микрофон. Можно написать текст.')}}
function normalizeSegments(text){const x=text.trim().replace(/[\r\t]+/g,' ');let parts=x.split(/(?:[;\n]+|[.!?]+\s+|,\s*(?=(?:надо|нужно|жду|ещё|еще|кстати|хочу|придумал|переживаю|а ещё))|\s+и\s+(?=(?:надо|нужно|жду|не забыть|купить|написать|забрать|отправить|записаться|ещё|еще|придумал)))/i).map(t=>t.trim().replace(/[.!?]+$/,'').trim()).filter(Boolean);if(!parts.length)parts=[x];if(parts.length>8)parts=[...parts.slice(0,7),parts.slice(7).join('. ')];return parts}
function suggestRoute(raw){const x=raw.toLowerCase();if(/(жду|ожидаю|ответа от|ответ от|должны ответить)/i.test(x))return 'waiting';if(/(встреча|созвон|собеседование|лекция)/i.test(x)&&/(завтра|послезавтра|сегодня|в понедельник|во вторник|в среду|в четверг|в пятницу|в субботу|в воскресенье|\d{1,2}[.:]\d{2}|\d{1,2}[./]\d{1,2})/i.test(x))return 'cal';if(/(хочу сделать проект|закончить проект|создать проект|сдать курсовую|запустить сайт|подготовить диплом)/i.test(x))return 'projects';if(/(идея|придумал|придумала|а что если|было бы здорово|интересная мысль|можно было бы)/i.test(x))return 'idea';if(/(когда-нибудь|однажды|может быть потом)/i.test(x))return 'someday';if(/(надо|нужно|не забыть|позвонить|написать|отправить|купить|забрать|записаться|сделать|проверить|подготовить|оплатить|заказать|сходить|договориться|отнести)/i.test(x))return 'next';if(/(ссылка|рецепт|цитата|артикул|номер заказа)/i.test(x))return 'notes';return 'reflection'}
function parseDate(raw){const x=raw.toLowerCase(),d=new Date();if(/послезавтра/.test(x))d.setDate(d.getDate()+2);else if(/завтра/.test(x))d.setDate(d.getDate()+1);else if(/сегодня/.test(x)){}else {const m=x.match(/\b(\d{1,2})[./](\d{1,2})(?:[./](\d{4}))?\b/);if(m){d.setFullYear(m[3]?Number(m[3]):d.getFullYear(),Number(m[2])-1,Number(m[1]));if(!m[3]&&d<new Date(new Date().toDateString()))d.setFullYear(d.getFullYear()+1)}else return ''}return iso(d)}
function localAnalyze(raw){return normalizeSegments(raw).map(part=>{const kind=suggestRoute(part);const clean=part.replace(/^(?:кстати[, ]*|а ещё\s+|ещё\s+)/i,'').trim();let title=clean;if(kind==='next')title=clean.replace(/^(надо|нужно|не забыть(?:\s+про)?)\s+/i,'').trim();title=title.charAt(0).toLocaleUpperCase('ru-RU')+title.slice(1);const tm=clean.match(/(?:\bв\s+)?(\d{1,2}):(\d{2})\b/);return {id:uid(),kind,title,date:kind==='cal'?parseDate(clean):'',time:kind==='cal'&&tm?`${tm[1].padStart(2,'0')}:${tm[2]}`:''}})}
function startCaptureAnalysis(){const el=document.getElementById('capture-text');if(el)captureText=el.value.trim();if(!captureText.trim()){say('Сначала расскажи или запиши мысль');return}stopVoice();if(!captureSourceId){captureSourceId=uid();state.inbox.unshift({id:captureSourceId,raw:captureText,created:Date.now()});}else{const existing=state.inbox.find(x=>x.id===captureSourceId);if(existing)existing.raw=captureText;else state.inbox.unshift({id:captureSourceId,raw:captureText,created:Date.now()})}save();capturePhase='processing';render();clearTimeout(captureTimer);captureTimer=setTimeout(()=>{captureDraft=localAnalyze(captureText);capturePhase='review';render()},850)}
function saveCaptureForLater(){const el=document.getElementById('capture-text');captureText=(el?.value||captureText).trim();if(!captureText){say('Сначала запиши мысль');return}if(captureSourceId){let n=state.inbox.find(x=>x.id===captureSourceId);if(n)n.raw=captureText;else state.inbox.unshift({id:captureSourceId,raw:captureText,created:Date.now()})}else state.inbox.unshift({id:uid(),raw:captureText,created:Date.now()});save();capturePhase='idle';captureText='';captureSourceId='';render();say('Сохранено во входящих — разберёшь позже')}
function syncReviewFields(){document.querySelectorAll('.capture-review-card').forEach(el=>{const item=captureDraft.find(x=>x.id===el.dataset.proposal);if(!item)return;item.title=el.querySelector('.capture-review-title')?.value||'';item.kind=el.querySelector('.capture-review-kind')?.value||'reflection';item.date=el.querySelector('.capture-proposal-date')?.value||item.date||'';item.time=el.querySelector('.capture-proposal-time')?.value||item.time||''})}
function confirmCaptureAnalysis(){syncReviewFields();const entries=captureDraft.map(x=>({...x,title:x.title.trim()})).filter(x=>x.title);if(!entries.length){say('Добавь хотя бы одну запись');return}for(const e of entries)if(e.kind==='cal'&&!e.date){say('Для календаря укажи дату или выбери другой тип');return}snapshot();const stats={count:entries.length,tasks:0,thoughts:0,events:0,rest:0};for(const e of entries){if(e.kind==='idea'||e.kind==='reflection'){state.thoughts.unshift({id:uid(),title:thoughtHeadline(e.title),body:e.title,kind:e.kind,created:Date.now(),starred:false,sourceId:captureSourceId});stats.thoughts++}else if(e.kind==='cal'){state.events.push({id:uid(),title:e.title,date:e.date,time:e.time||'',sourceId:captureSourceId});stats.events++}else if(e.kind==='projects'){state.projects.push({id:uid(),title:e.title,area:'Личное',outcome:e.title,sourceId:captureSourceId});stats.rest++}else if(e.kind==='notes'){state.notes.push({id:uid(),title:thoughtHeadline(e.title),text:e.title,sourceId:captureSourceId});stats.rest++}else if(e.kind==='inbox'){state.inbox.unshift({id:uid(),raw:e.title,created:Date.now()});stats.rest++}else{state.tasks.push({id:uid(),title:e.title,status:e.kind,energy:'easy',area:'Личное',project:null,hint:'Из сброса',steps:[],sourceId:captureSourceId});if(e.kind==='next')stats.tasks++;else stats.rest++}}state.inbox=state.inbox.filter(x=>x.id!==captureSourceId);state.captures.unshift({id:captureSourceId||uid(),raw:captureText,created:Date.now(),items:entries.map(e=>({kind:e.kind,title:e.title}))});save();receiptStats=stats;capturePhase='saved';render()}
function openCaptureHistory(){modal='capture-history';sheet(`<h2 class="sheet-title">История сбросов</h2><p class="sheet-sub">Исходные записи остаются целыми, даже когда их части распределены по разделам.</p>${state.captures.length?state.captures.map(c=>`<button class="history-entry" data-action="capture-history-detail" data-id="${c.id}"><span class="history-date">${dateTime(c.created)}</span><strong>${esc(c.raw).slice(0,110)}${c.raw.length>110?'…':''}</strong>${ic('chevron','sm')}</button>`).join(''):'<div class="empty-text">Пока не было подтверждённых разборов.</div>'}<button class="primary-btn" data-action="close">Закрыть</button>`)}

function resumeCapture(id){const it=state.inbox.find(x=>x.id===id);if(!it)return;close();captureText=it.raw;captureSourceId=id;capturePhase='idle';captureDraft=[];tab='capture';shelf='root';render();say('Исходная запись открыта')}

function render(scroll=true){palette();nav();document.getElementById('bottom').classList.remove('hidden-nav');const v=document.getElementById('viewport');const prevTop=v.scrollTop;v.innerHTML=tab==='capture'?captureView():tab==='now'?home():tab==='thoughts'?(thoughtDetail?memoryDetail():thoughtsView()):tab==='cal'?cal():shelf.startsWith('project:')?projectView(state.projects.find(p=>p.id===shelf.slice(8))):shelf==='root'?reviewHome():shelves();v.scrollTop=scroll?0:prevTop;if(tab==='now')attachSwipe()}
function close(){modal='';modalId='';draft=[];if(voice){try{voice.stop()}catch{}voice=null}document.getElementById('overlay').innerHTML=''}
function sheet(content){document.getElementById('overlay').innerHTML=`<div class="scrim" id="scrim"><section class="sheet" role="dialog" aria-modal="true"><div class="handle"></div>${content}</section></div>`}
function openCapture(){modal='capture';sheet(`<h2 class="sheet-title">Сбросить мысли</h2><p class="sheet-sub">Не нужно формулировать красиво. Просто выгрузи всё из головы.</p><textarea class="field-area" id="capture-text" placeholder="Что крутится в голове?"></textarea><div class="dual"><button class="secondary-btn" data-action="speak">${ic('mic','sm')} Голосом</button><button class="secondary-btn" data-action="close">Позже</button></div><button class="primary-btn" data-action="save-capture">Сохранить во входящие ${ic('arrowright','sm')}</button><p class="caption" style="margin-top:11px">Разобрать можно потом. Сейчас достаточно просто записать.</p>`);document.getElementById('capture-text').focus()}
function openInbox(){modal='inbox';const cnt=state.inbox.length;sheet(`<h2 class="sheet-title">Входящие ${cnt?`<span style="font-size:13px;color:var(--muted)">· ${cnt}</span>`:''}</h2><p class="sheet-sub">Здесь мысли ждут, пока ты захочешь с ними разобраться.</p>${cnt?state.inbox.map(it=>`<div class="inbox-entry"><p>${esc(it.raw)}</p><div class="row-space"><button class="link-btn" data-action="resume-inbox" data-id="${it.id}">${ic('spark','sm')} Разобрать</button><button class="link-btn" data-action="inbox-to-thought" data-id="${it.id}">${ic('feather','sm')} В мысли</button><button class="link-btn" data-action="remove-inbox" data-id="${it.id}" style="color:var(--muted)" aria-label="Удалить">${ic('trash','sm')}</button></div></div>`).join(''):'<div class="empty-text">Всё разобрано. Можно выдохнуть.</div>'}<div class="dual"><button class="secondary-btn" data-action="close">Закрыть</button><button class="secondary-btn" data-action="capture">${ic('plus','sm')} Новая мысль</button></div>`)}
function splitThought(text){return text.split(/(?:[;\n]+|\.\s+|\s+и\s+(?=(?:нужно|надо|не забыть|хочу|жду|придумал|идея|кажется|сегодня))|,\s*(?=нужно|надо|не забыть|кажется))/i).map(s=>s.trim()).filter(Boolean).slice(0,8).map(raw=>{let type=/(жду|ожидаю|ответ от|ожидание)/i.test(raw)?'waiting':/(когда-нибудь|может быть однажды|попробовать когда)/i.test(raw)?'someday':thoughtTypeFromText(raw)?'idea':/^(надо|нужно|не забыть|позвонить|написать|отправить|купить|забрать|записаться|сделать|проверить|подготовить)/i.test(raw)?'next':'reflection';let title=type==='next'?raw.replace(/^(надо|нужно|не забыть(?:\s+про)?)\s*/i,'').replace(/^./,c=>c.toUpperCase()):raw;return {title,type}})}
function analyze(id){const it=state.inbox.find(i=>i.id===id);if(!it)return;modal='analyze';modalId=id;draft=splitThought(it.raw);if(!draft.length)draft=[{title:it.raw,type:'next'}];drawProposal()}
function drawProposal(){sheet(`<h2 class="sheet-title">Разложим по полкам?</h2><p class="sheet-sub">Это демонстрационный разбор, не настоящий ИИ. Проверь формулировки перед сохранением.</p>${draft.map((d,i)=>`<div class="proposal"><input class="proposal-title" data-i="${i}" value="${esc(d.title)}" aria-label="Название действия"><div class="row-space"><select class="proposal-type" data-i="${i}" aria-label="Куда сохранить">${[['next','Следующее действие'],['waiting','Жду ответа'],['someday','Когда-нибудь'],['notes','Материал'],['projects','Проект'],['reflection','Мысль / дневник'],['idea','Идея']].map(([k,t])=>`<option value="${k}" ${d.type===k?'selected':''}>${t}</option>`).join('')}</select><button class="link-btn" data-action="del-proposal" data-i="${i}" style="color:var(--muted)" aria-label="Удалить вариант">${ic('x','sm')}</button></div></div>`).join('')}<button class="link-btn" data-action="add-proposal">${ic('plus','sm')} Добавить ещё</button><button class="primary-btn" data-action="confirm-proposal">Подтвердить разбор ${ic('check','sm')}</button><button class="secondary-btn" data-action="inbox" style="width:100%;margin-top:9px">Вернуться во входящие</button>`)}
function openHelp(){const t=getTask();if(!t)return;modal='help';const steps=t.steps?.length?t.steps:[`Открой всё, что понадобится для дела`, `Сделай первый шаг, не стремясь к идеалу`, `Отметь результат и реши, что дальше`];sheet(`<h2 class="sheet-title">Начни с малого</h2><p class="sheet-sub">${esc(t.title)}</p><div class="project-hero" style="margin:0"><span class="tag">Подсказка для старта · демо</span>${steps.map((s,i)=>`<div class="step-line"><span style="color:var(--p);font-weight:700;font-size:12px">0${i+1}</span><label>${esc(s)}</label></div>`).join('')}</div><button class="primary-btn" data-action="keep-steps" data-id="${t.id}">Сохранить шаги ${ic('check','sm')}</button><button class="secondary-btn" data-action="close" style="width:100%;margin-top:9px">Закрыть</button>`)}
function openReview(){modal='review';reviewChecks=[];const labs=['Все мысли из входящих разобраны','У проектов есть следующий шаг','Ожидания проверены','Идеи на будущее просмотрены'];sheet(`<h2 class="sheet-title">Недельный обзор</h2><p class="sheet-sub">Несколько минут, чтобы снова доверять своей системе. Без спешки.</p>${labs.map((t,i)=>`<div class="step-line"><input type="checkbox" id="review-${i}" data-review-check="${i}"><label for="review-${i}">${t}</label></div>`).join('')}<button class="primary-btn" data-action="finish-review">Закончить обзор ${ic('check','sm')}</button><button class="secondary-btn" data-action="close" style="width:100%;margin-top:9px">Не сейчас</button>`)}
function openSettings(){modal='settings';sheet(`<h2 class="sheet-title">Твой Сброс</h2><p class="sheet-sub">Настроить настроение интерфейса.</p><div class="field-label">ПАЛИТРА</div><div class="colors">${[['lavender','#5a528d'],['sage','#49755a'],['clay','#926249'],['ocean','#3a7485']].map(([p,c])=>`<button class="color-btn ${state.palette===p?'active':''}" style="background:${c}" data-palette="${p}" aria-label="Палитра ${p}"></button>`).join('')}</div><button class="secondary-btn" data-action="theme" style="width:100%">${ic(state.theme==='dark'?'sun':'moon','sm')} ${state.theme==='dark'?'Светлая тема':'Тёмная тема'}</button><button class="secondary-btn" data-action="reset" style="width:100%;margin-top:10px;color:var(--muted2)">Сбросить демонстрационные данные</button><button class="primary-btn" data-action="close">Готово</button>`)}
function openEdit(id){const t=state.tasks.find(t=>t.id===id)||state.done.find(t=>t.id===id);if(!t)return;modal='edit';modalId=id;sheet(`<h2 class="sheet-title">Дело</h2><p class="sheet-sub">Чуть больше деталей — только когда нужно.</p><label class="field-label">ЧТО СДЕЛАТЬ</label><input class="field" id="edit-title" value="${esc(t.title)}"><label class="field-label">ГДЕ ХРАНИТСЯ</label><select class="field" id="edit-status">${[['next','Следующие действия'],['waiting','Жду ответа'],['someday','Когда-нибудь']].map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select><label class="field-label">НАСКОЛЬКО СЛОЖНО</label><select class="field" id="edit-energy">${[['easy','Просто'],['medium','Средне'],['hard','Сложно']].map(([k,v])=>`<option value="${k}" ${t.energy===k?'selected':''}>${v}</option>`).join('')}</select><label class="field-label">СФЕРА</label><input class="field" id="edit-area" value="${esc(t.area)}"><button class="primary-btn" data-action="save-edit">Сохранить</button><button class="secondary-btn" style="width:100%;margin-top:10px" data-action="close">Отмена</button>`)}
function openNew(projectId=''){modal='new';modalId=projectId;sheet(`<h2 class="sheet-title">Добавить дело</h2><p class="sheet-sub">Одна мысль, одно действие.</p><textarea class="field-area" id="new-title" placeholder="Что нужно сделать?"></textarea><label class="field-label">КУДА СОХРАНИТЬ</label><select class="field" id="new-kind"><option value="next">Следующие действия</option><option value="projects">Новый проект</option><option value="waiting">Жду ответа</option><option value="someday">Когда-нибудь</option><option value="notes">Материалы</option></select><button class="primary-btn" data-action="save-new">Добавить ${ic('check','sm')}</button><button class="secondary-btn" data-action="close" style="width:100%;margin-top:9px">Отмена</button>`)}

function handle(action,id,elem){
if(action==='voice-toggle'){toggleVoice();return}
if(action==='start-analysis'){startCaptureAnalysis();return}
if(action==='capture-save-inbox'){saveCaptureForLater();return}
if(action==='capture-again'){captureText='';capturePhase='idle';captureSourceId='';draftReview=[];receiptStats=null;render();return}
if(action==='return-capture'){syncReviewFields();capturePhase='idle';render();return}
if(action==='review-remove'){syncReviewFields();draftReview=draftReview.filter(x=>x.id!==id);render(false);return}
if(action==='review-add'){syncReviewFields();draftReview.push({id:uid(),kind:'reflection',title:'',date:'',time:''});render(false);return}
if(action==='approve-analysis'){confirmCaptureAnalysis();return}
if(action==='go-to'){tab=elem.dataset.tab||'now';capturePhase='idle';captureText='';captureSourceId='';draftReview=[];receiptStats=null;thoughtDetail='';shelf='root';render();return}
if(action==='review-checklist'){openReview();return}
if(action==='capture-history'){openCaptureHistory();return}
if(action==='capture-history-detail'){openCaptureHistoryDetail(id);return}
if(action==='resume-inbox'){resumeCapture(id);return}
if(action==='open-thoughts'){tab='thoughts';thoughtDetail='';thoughtFilter='all';thoughtQuery='';thoughtSearch=false;render();return}
if(action==='leave-thoughts'){tab='thoughts';thoughtDetail='';render();return}
if(action==='back-to-thoughts'){thoughtDetail='';render();return}
if(action==='toggle-thought-search'){thoughtSearch=!thoughtSearch;if(!thoughtSearch)thoughtQuery='';render(false);if(thoughtSearch)document.getElementById('thought-search')?.focus();return}
if(action==='open-memory'){thoughtDetail=id;render();return}
if(action==='compose-thought'){tab='capture';thoughtDetail='';capturePhase='idle';captureText='';captureSourceId='';stopVoice();render();document.getElementById('capture-text')?.focus();return}
if(action==='save-thought'){const t=document.getElementById('thought-text')?.value.trim();if(!t){say('Запиши хотя бы пару слов');return}state.thoughts.unshift({id:uid(),kind:thoughtTypeFromText(t),title:thoughtHeadline(t),body:t,created:Date.now(),starred:false});save();close();thoughtDetail='';thoughtFilter='all';thoughtQuery='';thoughtSearch=false;render();say('Мысль сохранена');return}
if(action==='star-thought'){const m=state.thoughts.find(x=>x.id===id);if(m){m.starred=!m.starred;save();render(false);say(m.starred?'Добавлено в любимое':'Убрано из любимого')}return}
if(action==='edit-thought'){openThoughtEditor(id);return}
if(action==='save-thought-edit'){const m=state.thoughts.find(x=>x.id===modalId);if(!m)return;const title=document.getElementById('thought-title').value.trim(),body=document.getElementById('thought-body').value.trim();if(!title||!body){say('Нужно название и текст');return}m.title=title;m.body=body;m.kind=document.getElementById('thought-kind').value;save();close();render(false);say('Изменения сохранены');return}
if(action==='delete-thought'){snapshot();state.thoughts=state.thoughts.filter(x=>x.id!==id);thoughtDetail='';save();render();say('Запись удалена',true);return}
if(action==='extend-thought'){thoughtContinue(id);return}
if(action==='choose-thought-prompt'){document.getElementById('thought-extra').value=(elem.dataset.prompt||'')+'\n';document.getElementById('thought-extra').focus();return}
if(action==='save-thought-continued'){const m=state.thoughts.find(x=>x.id===modalId);if(!m)return;const val=document.getElementById('thought-extra').value.trim();if(!val){say('Напиши продолжение');return}m.body+='\n\n'+val;save();close();render(false);say('Мысль дополнена');return}
if(action==='related-thoughts'){thoughtRelated(id);return}
if(action==='jump-to-thought'){close();thoughtDetail=id;render();return}
if(action==='turn-thought-task'){thoughtToTask(id);return}
if(action==='save-thought-task'){const title=document.getElementById('thought-task-name').value.trim(),type=document.getElementById('thought-task-type').value;if(!title){say('Напиши название действия');return}if(type==='projects')state.projects.push({id:uid(),title,area:'Личное',outcome:'',sourceThought:modalId});else state.tasks.push({id:uid(),title,area:'Личное',energy:'easy',status:type,project:null,sourceThought:modalId,hint:'Из раздела «Мысли»',steps:[]});save();close();render(false);say('Добавлено. Исходная мысль сохранена.');return}
if(action==='inbox-to-thought'){const entry=state.inbox.find(x=>x.id===id);if(!entry)return;snapshot();state.thoughts.unshift({id:uid(),kind:thoughtTypeFromText(entry.raw),title:thoughtHeadline(entry.raw),body:entry.raw,created:Date.now(),starred:false});state.inbox=state.inbox.filter(x=>x.id!==id);save();openInbox();render(false);say('Сохранено в «Мысли»',true);return}
if(action==='capture'){close();tab='capture';capturePhase='idle';captureText='';captureSourceId='';render();return}if(action==='close'){close();return}if(action==='inbox'){openInbox();return}if(action==='skip'){const a=available();if(a.length)index=(index+1)%a.length;render(false);return}if(action==='reset-filters'){filter='easy';index=0;render();return}if(action==='complete'){const i=state.tasks.findIndex(t=>t.id===id);if(i<0)return;snapshot();state.done.push({...state.tasks.splice(i,1)[0],status:'done'});save();render(false);say('Готово. Хорошая работа.',true);return}if(action==='undo'){if(lastState){state=lastState;save();render(false);say('Отменено')}return}if(action==='help'){openHelp();return}if(action==='settings'){openSettings();return}if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();palette();openSettings();return}if(action==='reset'){if(!window.confirm('Вернуть первоначальные демонстрационные данные?'))return;state=fresh();save();tab='now';filter='easy';shelf='root';index=0;close();render();say('Демо-данные восстановлены');return}if(action==='save-capture'){const t=document.getElementById('capture-text').value.trim();if(!t){say('Сначала запиши мысль');return}state.inbox.unshift({id:uid(),raw:t,created:Date.now()});save();close();render(false);say('Мысль сохранена во входящих');return}if(action==='speak'){const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){say('Голосовой ввод недоступен в этом браузере');return}try{voice=new API();voice.lang='ru-RU';voice.interimResults=false;voice.onresult=e=>{const t=document.getElementById('thought-text')||document.getElementById('capture-text');if(t)t.value=(t.value.trim()+' '+e.results[0][0].transcript).trim()};voice.onerror=()=>say('Не удалось распознать речь — можно набрать текст');voice.start();say('Говори — запись началась')}catch{say('Не удалось включить микрофон')}return}if(action==='analyze'){analyze(id);return}if(action==='remove-inbox'){snapshot();state.inbox=state.inbox.filter(x=>x.id!==id);save();openInbox();say('Удалено из входящих',true);return}if(action==='del-proposal'){draft.splice(Number(elem.dataset.i),1);drawProposal();return}if(action==='add-proposal'){draft.push({title:'',type:'next'});drawProposal();return}if(action==='confirm-proposal'){const inputs=[...document.querySelectorAll('.proposal')];const entries=inputs.map(x=>({title:x.querySelector('input').value.trim(),type:x.querySelector('select').value})).filter(x=>x.title);if(!entries.length){say('Добавь хотя бы одну запись');return}for(const e of entries){if(e.type==='idea'||e.type==='reflection')state.thoughts.unshift({id:uid(),title:thoughtHeadline(e.title),body:e.title,kind:e.type,created:Date.now(),starred:false});else if(e.type==='notes')state.notes.push({id:uid(),title:e.title,text:''});else if(e.type==='projects')state.projects.push({id:uid(),title:e.title,area:'Личное',outcome:''});else state.tasks.push({id:uid(),title:e.title,area:'Личное',energy:'easy',status:e.type,project:null,hint:'Добавлено из входящих',steps:[]})}state.inbox=state.inbox.filter(x=>x.id!==modalId);save();close();render(false);say(`Разобрано: ${entries.length}`);return}if(action==='keep-steps'){const t=state.tasks.find(t=>t.id===id);if(t&&!(t.steps||[]).length)t.steps=['Подготовить всё необходимое','Сделать первый небольшой шаг','Проверить результат'];save();close();say('Шаги сохранены');return}if(action==='review'){openReview();return}if(action==='finish-review'){state.reviewedAt=new Date().toISOString();save();close();say('Обзор завершён');return}if(action==='edit'){openEdit(id);return}if(action==='save-edit'){const t=state.tasks.find(t=>t.id===modalId);if(!t)return;const title=document.getElementById('edit-title').value.trim();if(!title){say('Название не должно быть пустым');return}t.title=title;t.status=document.getElementById('edit-status').value;t.energy=document.getElementById('edit-energy').value;t.area=document.getElementById('edit-area').value.trim()||'Личное';save();close();render(false);say('Сохранено');return}if(action==='new'){openNew(shelf.startsWith('project:')?shelf.slice(8):'');return}if(action==='add-project-task'){openNew(id);return}if(action==='save-new'){const title=document.getElementById('new-title').value.trim(),kind=document.getElementById('new-kind').value;if(!title){say('Напиши, что нужно добавить');return}if(kind==='projects'){state.projects.push({id:uid(),title,area:'Личное',outcome:''})}else if(kind==='notes'){state.notes.push({id:uid(),title,text:''})}else state.tasks.push({id:uid(),title,status:kind,energy:'easy',area:'Личное',project:modalId||null,hint:'',steps:[]});save();close();render();say('Добавлено');return}if(action==='edit-note'){openNote(id);return}if(action==='save-note'){const n=state.notes.find(x=>x.id===modalId);if(n){n.title=document.getElementById('note-title').value;n.text=document.getElementById('note-body').value;save()}close();render();say('Сохранено');return}if(action==='prev-month'||action==='next-month'){month=new Date(month.getFullYear(),month.getMonth()+(action==='prev-month'?-1:1),1);selected=iso(month);render();return}if(action==='add-event'){openEvent();return}if(action==='edit-event'){openEvent(id);return}if(action==='save-event'){const title=document.getElementById('event-title').value.trim(),date=document.getElementById('event-date').value,time=document.getElementById('event-time').value;if(!title||!date){say('Укажи название и дату');return}let e=state.events.find(x=>x.id===modalId);if(e)Object.assign(e,{title,date,time});else state.events.push({id:uid(),title,date,time});selected=date;month=new Date(Number(date.slice(0,4)),Number(date.slice(5,7))-1,1);save();close();render();say('Сохранено в календаре');return}if(action==='delete-event'){state.events=state.events.filter(x=>x.id!==modalId);save();close();render();say('Событие удалено');return}}
document.addEventListener('click',e=>{const p=e.target.closest('button[data-palette]');if(p){state.palette=p.dataset.palette;save();palette();if(modal==='settings')openSettings();return}const t=e.target.closest('[data-tab]');if(t){close();stopVoice();thoughtScreen=false;thoughtDetail='';tab=t.dataset.tab;shelf='root';render();return}const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;index=0;render(false);return}const s=e.target.closest('[data-shelf]');if(s){shelf=s.dataset.shelf;render();return}const pr=e.target.closest('[data-project]');if(pr){shelf='project:'+pr.dataset.project;render();return}const fth=e.target.closest('[data-thought-filter]');if(fth){thoughtFilter=fth.dataset.thoughtFilter;render(false);return}const d=e.target.closest('[data-date]');if(d){selected=d.dataset.date;render(false);return}const a=e.target.closest('[data-action]');if(a){handle(a.dataset.action,a.dataset.id||'',a);return}if(e.target.id==='scrim')close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)close();else if(tab==='thoughts'&&thoughtDetail){thoughtDetail='';render()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.memory-card')){e.preventDefault();handle('open-memory',e.target.dataset.id,e.target)}});document.addEventListener('input',e=>{if(e.target.id==='thought-search'){thoughtQuery=e.target.value;const list=document.getElementById('thought-feed');if(list)list.innerHTML=thoughtsFeed()}if(e.target.id==='capture-text'){captureText=e.target.value;updateCaptureButton()}if(e.target.closest('.capture-review-card')){syncReviewFields()}});
document.addEventListener('change',e=>{if(e.target.closest('.capture-review-card')){syncReviewFields();if(e.target.classList.contains('capture-review-kind'))render(false)}});

function attachSwipe(){const el=document.getElementById('focus');if(!el)return;let start=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;start={x:e.clientX,y:e.clientY};el.classList.add('dragging')});el.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(Math.abs(dx)>Math.abs(dy)){el.style.transform=`translateX(${dx*.55}px) rotate(${dx*.012}deg)`;const right=el.querySelector('#stamp-done'),left=el.querySelector('#stamp-next');right.style.opacity=dx>40?Math.min(1,(dx-40)/100):0;left.style.opacity=dx< -40?Math.min(1,(-dx-40)/100):0}});const end=e=>{if(!start)return;const dx=e.clientX-start.x;start=null;el.classList.remove('dragging');el.style.transition='transform .22s ease';el.style.transform='';if(dx>100){const t=getTask();if(t)handle('complete',t.id)}else if(dx< -100)handle('skip');setTimeout(()=>{if(document.contains(el))el.style.transition=''},240)};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{start=null;el.style.transform='';el.classList.remove('dragging')})}
document.querySelector('#brand-symbol').innerHTML=ic('spark','sm');document.querySelector('#status-icons').innerHTML=ic('wifi','sm')+ic('battery','sm');render();
